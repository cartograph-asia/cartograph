# Cartograph prototype stack.
#
#   cd deploy
#   cp .env.example .env      # needed: sets MAIL_DEV_LOG=1 (sign-in links in the log)
#   docker compose up --build
#
# Then open http://localhost:8080. Only one host port is published: 8080
# (caddy).

name: cartograph

# Settings shared by the api and the one-shot commands built into its image.
x-api-env: &api-env
  API_ADDR: ${API_ADDR:-:8000}
  DATABASE_URL: ${DATABASE_URL:-postgres://cartograph:cartograph@postgres:5432/cartograph?sslmode=disable}
  S3_ENDPOINT: ${S3_ENDPOINT:-garage:3900}
  S3_BUCKET: ${S3_BUCKET:-cartograph}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-GKd530ae12b21f90f857abc4d8}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-072f12d29227eaaa0abc440478fc241b2680b11feb3f38d6a62b740a57d3eedf}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-true}
  S3_USE_SSL: ${S3_USE_SSL:-false}
  IMG_BASE_URL: ${IMG_BASE_URL:-http://localhost:8080/img}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
  UPLOAD_CONCURRENCY: ${UPLOAD_CONCURRENCY:-2}
  TILES_URL: ${TILES_URL:-/tiles/asia.pmtiles}
  BASE_URL: ${BASE_URL:-http://localhost:8080}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-cartograph.asia <hello@cartograph.asia>}
  # No default: without SMTP_HOST the api starts only with MAIL_DEV_LOG=1.
  MAIL_DEV_LOG: ${MAIL_DEV_LOG:-}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  ADMIN_SESSION_MAX_AGE: ${ADMIN_SESSION_MAX_AGE:-24h}
  SIGNUP: ${SIGNUP:-invite}
  INVITE_TTL: ${INVITE_TTL:-168h}
  CRAWLERS: ${CRAWLERS:-block}

services:
  postgres:
    # Plain PostgreSQL; PostGIS is not used by the prototype.
    image: postgres:16.15-alpine3.24
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cartograph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cartograph}
      POSTGRES_DB: ${POSTGRES_DB:-cartograph}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  garage:
    # Single-node Garage as the local S3 store (config in garage.toml). The
    # image has no shell, so there is no healthcheck; garage-init waits for it.
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    mem_limit: ${GARAGE_MEM_LIMIT:-512m}
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-dda494800248dc844572c3cb46c426b8ef2b3f1e6b83aa2ab47b47ee5a859c44}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-PAT5VqzxsIBdt0Y4PsJWopnlIQovuzPVD9jpjV8}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  # One-shot: assigns the node's layout, creates the bucket with website
  # access (served read-only via caddy /img/*) and imports the api's key.
  # Idempotent.
  garage-init:
    image: curlimages/curl:8.22.0
    depends_on:
      garage:
        condition: service_started
    entrypoint: ["/bin/sh", "/garage-init.sh"]
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-PAT5VqzxsIBdt0Y4PsJWopnlIQovuzPVD9jpjV8}
      S3_BUCKET: ${S3_BUCKET:-cartograph}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-GKd530ae12b21f90f857abc4d8}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-072f12d29227eaaa0abc440478fc241b2680b11feb3f38d6a62b740a57d3eedf}
    volumes:
      - ./garage-init.sh:/garage-init.sh:ro
    restart: "no"

  # Country import: provinces, districts, plots and places, one country at a
  # time, in one process (cmd/import; docs/COUNTRY_IMPORT_STAGE2_BRIEF.md).
  # The countries come from IMPORT_COUNTRIES (comma-separated codes). By
  # default this imports the Pattaya fixture (Thailand), so a clean
  # `docker compose up` shows a populated front page; for real extracts set
  # IMPORT_PBF, IMPORT_WATER and IMPORT_BBOX empty (the extracts are then read
  # from map/data, mounted at /srv/map/data) as in .env.example. A failed
  # country does not stop the next one; the exit code says if any failed.
  # `docker compose run --rm import -countries la -dry-run` replaces the
  # command and keeps the entrypoint's -data.
  import:
    image: cartograph-api:${API_TAG:-local}
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started # builds the image first
    entrypoint: ["/usr/local/bin/import", "-data=/srv/map/data"]
    command:
      - -countries=${IMPORT_COUNTRIES:-th}
      # The three overrides serve the fixture and a single country only; empty
      # means not given.
      - -pbf=${IMPORT_PBF-/usr/share/cartograph/fixtures/pattaya.osm.gz}
      - -water=${IMPORT_WATER-/usr/share/cartograph/fixtures/pattaya-water.shp}
      - -bbox=${IMPORT_BBOX-100.82,12.82,100.98,13.02}
    environment: *api-env
    volumes:
      - ../map:/srv/map:ro
    restart: "no"

  seed:
    image: cartograph-api:${API_TAG:-local}
    pull_policy: never
    depends_on:
      import:
        condition: service_completed_successfully
      garage-init:
        condition: service_completed_successfully
    entrypoint: ["/usr/local/bin/seed"]
    command: ["-photos=${SEED_PHOTOS:-30}"]
    environment: *api-env
    restart: "no"

  api:
    image: cartograph-api:${API_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    # A photo at the pixel limit needs up to about 400 MB while it is
    # decoded and resized, and the api processes two at once. GOMEMLIMIT
    # makes the Go runtime collect harder before the container limit, which
    # stops the api alone instead of the kernel picking a victim on the host.
    mem_limit: ${API_MEM_LIMIT:-1536m}
    depends_on:
      postgres:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    environment:
      <<: *api-env
      GOMEMLIMIT: ${API_GOMEMLIMIT:-1GiB}
    healthcheck:
      # The binary probes its own /healthz; distroless has no shell or curl.
      test: ["CMD", "/usr/local/bin/api", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

  web:
    image: cartograph-web:${WEB_TAG:-local}
    build:
      context: ../web
      dockerfile: ../deploy/Dockerfile.web
    restart: unless-stopped
    mem_limit: ${WEB_MEM_LIMIT:-128m}

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    mem_limit: ${CADDY_MEM_LIMIT:-256m}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
      garage-init:
        condition: service_completed_successfully
    environment:
      S3_BUCKET: ${S3_BUCKET:-cartograph}
      # Caddy adds X-Robots-Tag to the map app, tiles and photos it serves
      # itself unless this is allow; the api does the rest.
      CRAWLERS: ${CRAWLERS:-block}
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../map:/srv/tiles:ro
      - caddy-data:/data

volumes:
  postgres-data:
  garage-meta:
  garage-data:
  caddy-data:
