{{define "content" -}}
<div class="form">
<h1>Edit profile</h1>
{{if .Saved}}<p class="saved" role="status">Saved.</p>{{end}}
{{with .Error}}<p class="error" role="alert">{{.}}</p>{{end}}
<form method="post" action="/settings">
{{template "csrf" .}}
<p class="field"><span class="label">Surveyor name</span><a href="/surveyor/{{.Name}}">{{.Name}}</a></p>
<label for="bio">About you</label>
<textarea id="bio" name="bio" rows="5" maxlength="{{bioMax}}" aria-describedby="bio-hint">{{.Bio}}</textarea>
<p id="bio-hint" class="hint">Plain text, up to {{bioMax}} characters. Shown on your profile.</p>
<label for="home_region">Home region</label>
<select id="home_region" name="home_region">
<option value=""{{if not .HomeRegion}} selected{{end}}>None</option>
{{- range .Regions}}
<option value="{{.Slug}}"{{if eq .Slug $.HomeRegion}} selected{{end}}>{{.NameEn}}</option>
{{- end}}
</select>
<button type="submit">Save</button>
</form>
</div>
{{- end}}
