{{define "content" -}}
{{$p := .Photo}}{{$d := dims $p 2000}}
<figure class="photo">
<img src="{{img $p.Keys.Best}}" srcset="{{srcset $p.Keys 2000}}" sizes="(min-width: 76rem) 72rem, 100vw" width="{{$d.W}}" height="{{$d.H}}" alt="Photo at {{$p.Plot.Name}} by {{$p.Surveyor.Name}}" fetchpriority="high" decoding="async">
<figcaption>
<h1><a href="/plot/{{$p.Plot.Cell}}">{{$p.Plot.Name}}</a></h1>
<p class="meta">by <a href="/surveyor/{{$p.Surveyor.Name}}">{{$p.Surveyor.Name}}</a>{{if $p.FirstSurvey}} · <span class="first">first survey of this plot</span>{{end}}</p>
<p class="meta">{{with $p.TakenAt}}Taken {{date .}} · {{end}}Uploaded {{when .Now $p.UploadedAt}}</p>
<p class="licence">© {{$p.Surveyor.Name}}, <a rel="license" href="{{.Licence.URL}}">{{.Licence.Name}}</a> · <a href="{{img $p.Keys.Large}}">Full size</a></p>
</figcaption>
</figure>
{{if gt .Count 1}}<nav class="pages" aria-label="Photos of this plot">
{{- with .Prev}}<a rel="prev" href="/photo/{{.ID}}">← Older</a>{{else}}<span></span>{{end}}
<span>Photo {{.Position}} of {{.Count}} <a href="/plot/{{$p.Plot.Cell}}">in this plot</a></span>
{{- with .Next}}<a rel="next" href="/photo/{{.ID}}">Newer →</a>{{else}}<span></span>{{end -}}
</nav>{{end}}
{{- end}}
