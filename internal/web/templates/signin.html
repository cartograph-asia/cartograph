{{define "content" -}}
<div class="form">
<h1>Sign in</h1>
<p class="lede">Enter your e-mail address and we send you a link to sign in. There is no password.</p>
{{with .Error}}<p class="error" role="alert">{{.}}</p>{{end}}
<form method="post" action="/signin">
{{template "csrf" .}}
{{with .Next}}<input type="hidden" name="next" value="{{.}}">{{end}}
<label for="email">E-mail address</label>
<input id="email" name="email" type="email" value="{{.Email}}" autocomplete="email" required{{if .Error}} autofocus aria-invalid="true"{{end}}>
<button type="submit">Send me a link</button>
</form>
<p class="note">You only need an account to upload photos. Everything else is open to everyone.</p>
</div>
{{- end}}
